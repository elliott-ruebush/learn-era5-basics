[project]
name = "geospatial-learning"
version = "0.1.0"
description = "ERA5 data exploration with cdsapi and xarray"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arraylake>=0.28.1",
    "cartopy>=0.25.0",
    "cdsapi>=0.7.7",
    "dask>=2025.12.0",
    "flox>=0.10.8",
    "gcsfs>=2023.6.0",
    "h5netcdf>=1.7.3",
    "icechunk>=1.1.16",
    "marimo>=0.18.4",
    "matplotlib>=3.10.8",
    "metpy>=1.7.1",
    "pint>=0.25.2",
    "pint-xarray>=0.6.0",
    "pyproj>=3.7.2",
    "xarray>=2025.12.0",
    "xclim>=0.60.0",
    "zarr>=2.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "numpy>=2.0.0",
    "pre-commit>=4.0.0",
    "ruff>=0.9.0",
    "ty>=0.0.13",
]

[project.scripts]
download-era5 = "geospatial_learning.scripts.downloader:run_download"
explore-era5 = "geospatial_learning.scripts.explorer:run_exploration"
update-docs = "geospatial_learning.scripts.update_docs_index:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "ARG", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Marimo notebooks use uppercase arguments for constants and expressions for display
"notebooks/*.py" = ["N803", "B018", "ARG001", "RUF059", "N806"]

[tool.ty.environment]
python-version = "3.13"
