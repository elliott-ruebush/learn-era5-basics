[project]
name = "era5-basics"
version = "0.1.0"
description = "ERA5 data exploration with cdsapi and xarray"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cdsapi>=0.7.7",
    "dask>=2025.12.0",
    "h5netcdf>=1.7.3",
    "xarray>=2025.12.0",
]

[project.scripts]
download-era5 = "era5_basics.exploration.downloader:run_download"
explore-era5 = "era5_basics.exploration.explorer:run_exploration"

[tool.uv]
package = true
